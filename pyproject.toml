[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peagent-analysis"
version = "1.0.2"
description = "Analysis code for PEAgent: sequence-to-single-cell modelling of plant chromatin accessibility and its regulatory grammar"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# Pinned, tested versions are in environment.yml. The `peagent` helper package
# ships in this repository; scripts import it from the repository root.
dependencies = ["tensorflow", "numpy", "scipy", "pandas", "h5py", "scikit-learn",
                "statsmodels", "matplotlib", "pysam", "anndata", "scanpy", "leidenalg"]

[tool.setuptools]
packages = ["peagent"]
