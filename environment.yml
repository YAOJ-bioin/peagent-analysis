# Versions tested (Rocky Linux 9.5; all analyses in the paper). Motif discovery for
# 03_lexicon/02-03 uses a separate environment, see README "System requirements".
name: peagent
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
      - tensorflow==2.13.1
      - numpy==1.24.3
      - scipy==1.10.1
      - pandas==2.0.3
      - h5py==3.11.0
      - scikit-learn==1.3.2
      - statsmodels==0.14.1
      - matplotlib==3.7.5
      - pysam==0.23.3
      - anndata==0.9.2
      - scanpy==1.9.8
      - leidenalg==0.10.2
      - igraph==0.11.8
      - umap-learn==0.5.7
